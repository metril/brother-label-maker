[project]
name = "labelmaker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pillow>=10",
    "packbits",
    "pyusb>=1.2",
    "aiosqlite>=0.20",
    "resvg-py==0.3.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.32",
    "qrcode>=7",
    "python-barcode>=0.15",
    "ppf-datamatrix>=0.2",
    # Runtime dep since task 3.1 (homebox/client.py); was previously
    # dev-only for the API test suite's ASGI transport.
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "respx>=0.21",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.4",
    "zxing-cpp>=3.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # test_api_ws.py is the only file that imports starlette.testclient (for
    # WebSocket support: httpx.AsyncClient/ASGITransport, used everywhere
    # else in the API suite, has none). Importing it with only `httpx`
    # installed -- not `httpx2` -- warns at *import time* that httpx2 should
    # replace it as TestClient's backend. That's an upstream test-
    # infrastructure migration path, not something this task's brief asked
    # for (it explicitly names httpx>=0.27 as the dev dependency to add;
    # httpx2 is a different, unrequested package). Suppressed narrowly by
    # exact message text so an unrelated future StarletteDeprecationWarning
    # would still surface normally.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labelmaker"]
