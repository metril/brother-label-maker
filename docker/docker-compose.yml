# Reference deployment: single container serving the SPA + API, with USB
# passthrough for a real PT-E720BT. Run from the repo root:
#   docker compose -f docker/docker-compose.yml up --build
#
# See ../docs/usb-setup.md for host-side prerequisites (udev rule) this
# depends on, and ../docs/protocol-notes.md for the physical checkpoint that
# resolves PRINTER_INIT_STRATEGY.

services:
  labelmaker:
    image: brother-label-maker:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # HOMEBOX_API_KEY deliberately absent: the key is a secret and lives in
      # the DB settings overlay (Settings page, or
      # `PUT /api/settings {"homebox_api_key": "..."}`) -- never in this file.
      HOMEBOX_URL: https://homebox.azureolympos.com
      PRINTER_MODE: usb
      # Verified 2026-07-28 (first physical print, docs/protocol-notes.md
      # RESULTS): classic works; e310bt was never needed.
      PRINTER_INIT_STRATEGY: classic
      # Orientation knobs, resolved at the same checkpoint: msb_first bit
      # order and flipped pins are correct for the PT-E720BT and are now the
      # AppConfig defaults -- only uncomment to EXPERIMENT away from them.
      # PRINTER_BIT_ORDER: lsb_first
      PRINTER_FLIP_PINS: "true"
      # M3: CORS_ORIGINS is a JSON array, not a bare string -- see config.py's
      # AppConfig.cors_origins field comment for the exact env-var syntax.
      # Only needed if the frontend is served from a different origin than
      # this container (e.g. a separate static host) instead of the SPA
      # this image mounts itself (main.py's _resolve_static_dir).
      # CORS_ORIGINS: '["https://labels.example.com"]'
    volumes:
      # Bind-mount the *directory*, not a specific device node
      # (`/dev/bus/usb/001/005`-style paths under `devices:` renumber on
      # every replug/power-cycle -- a `--device`/`devices:` entry pinned to
      # today's path silently goes stale the next time the printer is
      # unplugged and replugged, or the container restarts after the host
      # reboots). Mounting the whole `/dev/bus/usb` tree means whatever node
      # the printer re-enumerates onto is already reachable for OPENING the
      # device on a (re)start of this container. That's a distinct step
      # from DISCOVERY, though: libusb finds devices via sysfs, not by
      # scanning this directory, and a container that's already running
      # when the printer gets unplugged/replugged is not guaranteed to
      # notice without being restarted. See ../docs/usb-setup.md's
      # "Hotplug / power-cycle behavior" section for the full explanation
      # and the restart-based workaround.
      - /dev/bus/usb:/dev/bus/usb
      - labeldata:/data
    # Grants access to USB device nodes (major 189, all minors) without
    # `--privileged` (which would hand the container the entire host device
    # namespace plus capabilities it doesn't need) and without a `devices:`
    # list (which hits the same stale-path problem as above, one entry per
    # device instead of one bind mount). The cgroup rule + directory mount
    # combination is what lets a (re)started container open the printer
    # wherever it's currently enumerated, across unplug/replug and reboot
    # cycles -- see ../docs/usb-setup.md for why that's a stronger
    # guarantee than an already-running container noticing a mid-session
    # replug. The printer's actual, non-root-writable access still comes
    # from the udev rule in docker/99-brother-pte720bt.rules (MODE="0666"),
    # installed on the HOST -- this rule only gets the container's cgroup
    # permission to open the node once it exists.
    device_cgroup_rules:
      - "c 189:* rmw"

volumes:
  labeldata: {}
