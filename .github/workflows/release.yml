# Release: build the runtime image (docker/Dockerfile) for linux/amd64 +
# linux/arm64 and publish it to GHCR.
#
# Trigger:
#   - push of a tag matching `v*` (e.g. v1.2.3) -- the normal release path.
#   - workflow_dispatch -- manual re-run. Run this against an existing
#     release tag (pick it from the "Use workflow from" ref selector, not
#     a branch): the image tags below are all derived from `type=semver`,
#     which only produces tags when GITHUB_REF is itself a semver git tag.
#     Dispatching from a branch will make docker/metadata-action emit zero
#     tags and the push step will fail -- that's intentional, not a bug:
#     this workflow only ever publishes tagged releases, never ad-hoc
#     branch builds.
#
# Permissions: the build-and-push job needs `packages: write` (to push to
# ghcr.io as GITHUB_TOKEN) plus `contents: read` (to check out the repo);
# both are scoped to that job rather than the whole workflow.
#
# Image tags (docker/metadata-action): the pushed tags are the release
# version (`{{version}}`, e.g. 1.2.3) and its `{{major}}.{{minor}}` alias
# (e.g. 1.2). `latest` is stamped ONLY on a real tag push of a
# non-prerelease version -- metadata-action derives tags purely from the
# CURRENT ref (it never consults the registry), so without the
# `enable=push` guard a workflow_dispatch re-run of an old tag would move
# `latest` BACKWARDS onto that old version for every `:latest` puller.
#
# docs/usb-setup.md and the deploy docs (task 4.4) reference the published
# image as `ghcr.io/<owner>/brother-label-maker:latest`.
#
# Test gate: ci.yml is not a reusable workflow (no `workflow_call` trigger),
# so its backend/frontend jobs can't be invoked directly here without
# editing that file -- out of scope for this task. Instead the `backend`
# and `frontend` jobs below duplicate ci.yml's steps verbatim (same action
# versions, same commands) so a release can never be pushed without passing
# the same gate as CI. Keep these two jobs in sync with ci.yml if that
# file's steps change.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Queue rather than cancel: a same-tag re-run shouldn't abort an
  # in-flight publish.
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  # Mirrors ci.yml's `backend` job exactly (same setup-uv version/comment,
  # same commands) -- the release gate must be at least as strict as CI.
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Exact tag, not a floating major: astral-sh/setup-uv stopped
        # publishing floating major tags after v7 (v8/v9 exist only as
        # exact release tags) -- see ci.yml for the fuller note.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        # --locked: fail instead of silently re-resolving a stale lock.
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest --cov=labelmaker --cov-report=term

  # Mirrors ci.yml's `frontend` job exactly.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  build-and-push:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags/labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # latest=false + the explicit raw rule below: `latest` moves only
          # on a genuine tag PUSH (not a dispatch re-run of an old tag),
          # and never onto a prerelease (is_default_branch is false there
          # -- the prerelease guard rides the semver `enable`).
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # cache-from only (no cache-to): a release runs under the tag
          # ref's own Actions-cache scope, which no later run can restore
          # from -- writing mode=max there would just evict main's shared
          # ci.yml cache entries against the repo's 10GB limit (review).
          cache-from: type=gha
