name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version-file: backend/.python-version
          enable-cache: true

      - name: Install dependencies
        # --locked: fail CI on a stale lock instead of silently
        # re-resolving it (uv sync --dev alone would do the latter).
        run: uv sync --locked --dev

      - name: Lint
        # No `ruff format --check` here: the codebase has never been
        # ruff-format'ed, and introducing that gate now would mean a
        # repo-wide formatting-churn commit for no functional benefit.
        # Deliberate non-goal for this task.
        run: uv run ruff check .

      - name: Test
        # Coverage is informational only -- no --cov-fail-under gate.
        # A hard threshold on a still-young test suite would just be
        # noise (blocking merges over incidental coverage dips) rather
        # than a signal; revisit once the suite has matured.
        run: uv run pytest --cov=labelmaker --cov-report=term

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (multi-arch, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
