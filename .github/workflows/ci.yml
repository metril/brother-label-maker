name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Exact tag, not a floating major: astral-sh/setup-uv stopped
        # publishing floating major tags after v7 (v8/v9 exist only as
        # exact release tags, e.g. this one -- confirmed by both a 404 on
        # the floating `v9` ref and a 200 on `v9.0.0`).
        uses: astral-sh/setup-uv@v9.0.0
        with:
          # No python-version(-file) here on purpose: setup-uv has no
          # python-version-file input -- only python-version, which would
          # re-create the two-places pin this step exists to kill. uv
          # itself reads backend/.python-version at sync time (run steps
          # below are cwd=backend via defaults.run.working-directory), so
          # the pin lives in exactly one place.
          enable-cache: true

      - name: Install dependencies
        # --locked: fail CI on a stale lock instead of silently
        # re-resolving it (uv sync --dev alone would do the latter).
        run: uv sync --locked --dev

      - name: Lint
        # No `ruff format --check` here: the codebase has never been
        # ruff-format'ed, and introducing that gate now would mean a
        # repo-wide formatting-churn commit for no functional benefit.
        # Deliberate non-goal for this task.
        run: uv run ruff check .

      - name: Test
        # Coverage is informational only -- no --cov-fail-under gate.
        # A hard threshold on a still-young test suite would just be
        # noise (blocking merges over incidental coverage dips) rather
        # than a signal; revisit once the suite has matured.
        run: uv run pytest --cov=labelmaker --cov-report=term

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (multi-arch, not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
