<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Label Studio — PT-E720BT</title>
    <script>
      // Pre-paint theme (see src/hooks/useTheme.ts): runs before the bundle
      // loads so the correct theme is already on <html> for the very first
      // paint -- no flash of the wrong theme while React boots. Mirrors
      // useTheme's own default exactly: no stored preference at all means
      // "dark" (this app's identity is dark; system is opt-in), not
      // "system" -- only an explicit "system" choice ever leaves the
      // `data-theme` attribute off (letting index.css's own
      // prefers-color-scheme media query govern instead).
      (function () {
        // localStorage.getItem/setItem throw (SecurityError) when site
        // data is blocked -- there's no React ErrorBoundary this early (the
        // bundle hasn't even loaded yet), so an uncaught throw here
        // white-screens before the very first paint. Mirrors
        // src/hooks/useTheme.ts's own try/catch exactly (L15 review fix):
        // fall back to "dark", this app's own unconfigured-browser default.
        try {
          var stored = localStorage.getItem("lm-theme");
          if (stored === "light") {
            document.documentElement.dataset.theme = "light";
          } else if (stored === "system") {
            delete document.documentElement.dataset.theme;
          } else {
            document.documentElement.dataset.theme = "dark";
          }
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
